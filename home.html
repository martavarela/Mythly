<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mythly</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='90' text-anchor='middle' x='50'>⚡</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{
            --title-size: clamp(2.5rem, 9vw, 10rem);
            --subtitle-size: clamp(1.2rem, 3vw, 2rem);
            --header-gap: 1rem;
            --sticky-offset: 6rem;
            --light-tone: #eef6ff;
        }
        body {
            font-family: Georgia, "Times New Roman", serif;
            margin: 2rem;
            line-height: 1.6;
            padding-top: 0;
            background: transparent;
        }
        html {
            background: linear-gradient(135deg, rgba(224, 239, 255, 0.88), rgba(239, 231, 255, 0.88)), url('mountolympus.jpg') center/cover fixed no-repeat;
        }
        .site-header { position: relative; top: 0; left: 0; right: 0; z-index: 1000; }
        .header-top { display: flex; align-items: center; justify-content: space-between; background: rgba(245, 230, 200, 0.98); padding: 0.8rem 2rem; box-sizing: border-box; border-radius: 0.75rem 0.75rem 0 0; box-shadow: 0 14px 28px rgba(0,0,0,0.14); }
        h1 {
            color: #000000;
            margin: 0;
            font-family: 'Cormorant Garamond', serif; font-weight: 600; text-transform: uppercase; letter-spacing: 0.15em;
            font-size: clamp(2rem, 6vw, 3.5rem);
            line-height: 1;
            display: block;
            position: relative;
            z-index: 1001;
            white-space: nowrap;
        }
        .subtitle {
            background: rgba(220, 245, 225, 0.98);
            padding: 1rem 2rem;
            border-radius: 0 0 0.75rem 0.75rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }
        .subtitle p {
            margin: 0;
            font-family: 'Cormorant Garamond', serif; font-weight: 500; text-transform: none; letter-spacing: 0.02em;
            font-size: var(--subtitle-size);
            color: #0b3b1f;
            text-align: center;
        }
        .top-nav {
            display: flex;
            justify-content: flex-end;
            gap: 2rem;
            align-items: center;
            padding: 0;
            box-sizing: border-box;
            position: relative;
            z-index: 1200;
        }
        html{scroll-behavior:smooth}
        :target{scroll-margin-top:var(--sticky-offset)}
        .top-nav a {
            color: #0b3b1f;
            text-decoration: none;
            font-family: 'Cormorant Garamond', serif; font-weight: 500; text-transform: none; letter-spacing: 0.15em;
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            padding: 0;
            line-height: 1;
            display: inline-block;
            background: none;
            border-radius: 0;
            box-shadow: none;
            border: none;
            pointer-events: auto;
        }
        .top-nav a:hover {
            text-decoration: underline;
            filter: brightness(0.7);
        }
        .top-nav a:active {
            text-decoration: underline;
        }
        a[href="step-onto-mount-olympus.html"] {
            display: block;
            max-width: 900px;
            margin: 2rem auto 0;
            text-decoration: none;
            color: inherit;
        }
        .hero-focus {
            max-width: 900px;
            margin: 0 auto;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 18px 36px rgba(38, 61, 84, 0.24);
            border: 1px solid rgba(0,0,0,0.12);
            background:
                linear-gradient(135deg, rgba(224, 239, 255, 0.78), rgba(239, 231, 255, 0.78)),
                url('mountolympus.jpg') center/cover no-repeat;
            min-height: 300px;
            display: flex;
            align-items: flex-end;
        }
        .hero-copy {
            width: 100%;
            background: linear-gradient(to top, rgba(238, 246, 255, 0.92), rgba(238, 246, 255, 0.48));
            color: #1f3f53;
            padding: 1rem 1.1rem;
        }
        .hero-copy h2 {
            margin: 0;
            font-size: clamp(1.3rem, 2.6vw, 2rem);
            text-decoration: none;
        }
        .hero-copy p {
            margin: 0.35rem 0 0;
            font-size: 1rem;
        }
        a[href="step-onto-mount-olympus.html"]:hover .hero-copy h2,
        a[href="step-onto-mount-olympus.html"]:active .hero-copy h2 {
            text-decoration: underline;
        }
        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            body { margin: 1rem; }
            .header-top { padding: 0.6rem 1rem; }
            h1 { white-space: normal; }
            .top-nav { gap: 1rem; flex-wrap: wrap; }
            .top-nav a { font-size: clamp(0.9rem, 2.2vw, 1rem); }
            button, .game-btn { min-height: 44px; padding: 0.6rem 1rem; font-size: 1rem; }
        }
        @media (max-width: 480px) {
            body { margin: 0.75rem; }
            .header-top { padding: 0.5rem 0.75rem; gap: 0.5rem; }
            h1 { font-size: clamp(1.5rem, 5vw, 2.5rem); }
            .top-nav { gap: 0.75rem; }
            .top-nav a { font-size: 0.85rem; }
            button, .game-btn { min-height: 48px; padding: 0.7rem 0.9rem; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-top">
            <h1 id="site-title" data-edit-id="site-title" data-editable>Mythly</h1>
            <nav class="top-nav" aria-label="Main navigation">
                <a href="characters.html">Characters</a>
                <a href="quizzes.html">Quizzes</a>
                <a href="myths.html">Myths</a>
                <a href="mythly-tools.html">Tools</a>
                <a href="fun.html">Fun</a>
                <a href="about.html">About</a>
            </nav>
        </div>
        <div class="subtitle">
            <p id="site-subtitle" data-edit-id="site-subtitle" data-editable>Welcome to Mythly, a website for exploring the world of greek mythology</p>
        </div>
    </header>

    <a href="step-onto-mount-olympus.html">
        <section class="hero-focus" aria-label="Olympian highlight">
            <div class="hero-copy">
                <h2>Step Onto Mount Olympus</h2>
                <p>Meet gods, test your myth knowledge, and explore legendary stories.</p>
            </div>
        </section>
    </a>
    </body>
</html>
